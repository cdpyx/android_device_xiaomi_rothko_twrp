name: Build TWRP for Xiaomi 14T Pro (rothko)

on:
  workflow_dispatch: # 允许在 GitHub 页面手动触发编译
  push:
    branches:
      - twrp-14.1_a16 

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04

    steps:
      # 1. 检出当前设备树仓库
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/xiaomi/rothko
          fetch-depth: 0

      # 2. 设置 ccache 缓存 (加速编译并提高稳定性)
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ github.ref }}
          max-size: 2G

      # 3. 安装编译依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip repo

      # 4. 配置 Git
      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      # 5. 初始化 Repo (使用正确的 AOSP Manifest)
      - name: Initialize Repo
        run: |
          cd workspace
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1

      # 6. 同步源码 (移除 -q 以便在失败时能看到完整的错误日志)
      - name: Sync Repo
        run: |
          cd workspace
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      # 7. 编译 TWRP Recovery
      - name: Build TWRP
        run: |
          cd workspace
          
          # 启用 ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 2G
          
          # 设置环境变量
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          
          # 执行 lunch (已确认您的设备树中定义为 twrp_rothko-eng)
          lunch twrp_rothko-eng
          
          # 开始编译
          mka recoveryimage -j$(nproc --all)

      # 8. 上传编译产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-rothko-recovery
          path: workspace/out/target/product/rothko/*.img
          retention-days: 7
