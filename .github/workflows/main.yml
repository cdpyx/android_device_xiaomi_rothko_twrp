name: Build TWRP for Xiaomi 14T Pro (rothko)

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-14.1_a16

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # 显式设置最大运行时间为 6 小时，防止过早被判定超时

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/xiaomi/rothko
          fetch-depth: 0

      - name: Install Dependencies & Setup Swap
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip repo

          # ✅ 核心优化 1：创建 8GB 的 Swap 虚拟内存，防止 soong_build 链接阶段因内存不足 (OOM) 被杀
          echo "Setting up 8GB swap space..."
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Initialize Repo
        run: |
          cd workspace
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1

      - name: Sync Repo
        run: |
          cd workspace
          repo sync -c -q -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build TWRP
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          
          # Android 14+ 强制要求 <product>-<release>-<variant> 格式
          lunch twrp_rothko-ap2a-eng
          
          # ✅ 核心优化 2：限制并发数为 4。
          # 虽然 $(nproc --all) 更快，但在 7GB 内存限制下，链接阶段极易 OOM。
          # -j4 能在可接受的时间内最大程度保证编译稳定性。
          mka recoveryimage -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-rothko-recovery
          path: workspace/out/target/product/rothko/*.img
          retention-days: 7
