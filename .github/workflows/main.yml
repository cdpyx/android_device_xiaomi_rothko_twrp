name: Build TWRP for Xiaomi 14T Pro (rothko)

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-14.1_a16

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/xiaomi/rothko
          fetch-depth: 0

      - name: Install Dependencies & Setup Swap
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip repo

          echo "Setting up 8GB swap space..."
          # ✅ 核心修复 1：先关闭并删除系统默认已挂载的旧 swap 文件，防止 "Text file busy" 错误
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          
          # ✅ 核心修复 2：使用 dd 命令创建 8GB 的 swap 文件（比 fallocate 兼容性更好，且能绕过文件系统限制）
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 验证 swap 是否成功挂载
          sudo swapon --show
          free -h

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Initialize Repo
        run: |
          cd workspace
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1

      - name: Sync Repo
        run: |
          cd workspace
          repo sync -c -q -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build TWRP
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          
          # Android 14+ 强制要求 <product>-<release>-<variant> 格式
          lunch twrp_rothko-ap2a-eng
          
          # 限制并发数为 4，防止最后链接阶段 OOM
          mka recoveryimage -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-rothko-recovery
          path: workspace/out/target/product/rothko/*.img
          retention-days: 7
